events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    charset utf-8;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /favicon.ico {
      rewrite ^ /static/favicon-32x32.png last;
    }

    location = /api {
      proxy_pass http://chainlensapi:8090/;
    }

    location /api/ {
      proxy_pass http://chainlensapi:8090/;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # chainlens-nfts-redirect: Free tier has no /nfts/* support (API 500)
    location ~ ^/nfts/(0x[0-9a-fA-F]+)/?$ {
      return 302 /contracts/$1;
    }

    location / {
      proxy_pass http://chainlensweb:3000/;
    }

    error_page 500 502 503 504 /5xx.html;
    location = /5xx.html {
      root /www/error_pages/;
    }
  }
}
